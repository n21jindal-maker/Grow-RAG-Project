name: Daily Data Ingestion

on:
  schedule:
    # 04:30 AM UTC = 10:00 AM IST
    - cron: '30 4 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  ingest_and_update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit changes back to the repository
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: rag-mf-assistant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: rag-mf-assistant/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ingestion Pipeline
        env:
          # Ensure API keys are set in GitHub Repository Secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # The exact command may depend on the final implementation of main.py
          python main.py --ingest-only

      - name: Commit and push updated indexes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Force add ignored files (ChromaDB and pickle files) as specified in Phase 8
          git add -f chroma_db/ 
          git add -f *.pkl
          git add data/
          
          git commit -m "chore: automated daily data ingestion and index update" || echo "No changes to commit"
          git pull --rebase || true
          git push
