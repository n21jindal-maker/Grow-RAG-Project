<style>
        .glass-header {
            background: rgba(248, 249, 250, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .message-enter {
            animation: slideUpFade 0.3s ease-out forwards;
        }
        @keyframes slideUpFade {
            from {
                opacity: 0;

            }
            to {

            }
        }
        .typing-dot {
            animation: typingPulse 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typingPulse {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }
        /* Hide scrollbar for side nav */

<!-- Main Content Area -->

        </div>
<!-- Main Chat Area -->
<main class="flex-1 overflow-y-auto pb-[96px] px-margin-mobile md:px-margin-desktop w-full flex flex-col gap-md" id="chat-container">
<!-- Welcome / Empty State -->

<div class="flex flex-wrap justify-center gap-3 w-full max-w-2xl">
<button class="chip-btn bg-surface-container-lowest border border-outline-variant text-on-surface px-4 py-2 rounded-full text-left font-body-md text-body-md hover:border-primary hover:text-primary transition-colors focus:ring-2 focus:ring-primary-container outline-none shadow-sm flex items-center gap-2">

                    </button>
<button class="chip-btn bg-surface-container-lowest border border-outline-variant text-on-surface px-4 py-2 rounded-full text-left font-body-md text-body-md hover:border-primary hover:text-primary transition-colors focus:ring-2 focus:ring-primary-container outline-none shadow-sm flex items-center gap-2">
                        "What is the exit load for HDFC Gold ETF Fund?"
                    </button>
<button class="chip-btn bg-surface-container-lowest border border-outline-variant text-on-surface px-4 py-2 rounded-full text-left font-body-md text-body-md hover:border-primary hover:text-primary transition-colors focus:ring-2 focus:ring-primary-container outline-none shadow-sm flex items-center gap-2">
                        "What is the Returns offered by HDFC Small Cap Fund?"
                    </button>

<div class="absolute bottom-0 w-full z-40 p-margin-mobile md:p-margin-desktop bg-gradient-to-t from-background via-background to-transparent pb-6 pt-12 pointer-events-none">

<button class="bg-primary text-white w-12 h-12 rounded-xl flex items-center justify-center shrink-0 hover:bg-primary/90 transition-colors focus:ring-2 focus:ring-primary-container focus:ring-offset-2 outline-none active:scale-95 disabled:opacity-50 disabled:bg-surface-container-high disabled:text-on-surface-variant disabled:cursor-not-allowed mb-0.5 mr-0.5" id="send-btn">

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatContainer = document.getElementById('chat-container');
            const welcomeState = document.getElementById('welcome-state');
            const chatInput = document.getElementById('chat-input');
            const sendBtn = document.getElementById('send-btn');
            const chipBtns = document.querySelectorAll('.chip-btn');

            let isTyping = false;

            // Auto-resize textarea
            chatInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
                if(this.value.trim().length > 0) {
                    sendBtn.removeAttribute('disabled');
                } else {
                    sendBtn.setAttribute('disabled', 'true');
                }
            });

            const createMessageElement = (text, isUser = false) => {
                const wrapper = document.createElement('div');
                wrapper.className = `flex w-full message-enter ${isUser ? 'justify-end' : 'justify-start'}`;
                
                const bubble = document.createElement('div');
                bubble.className = `max-w-[85%] md:max-w-[75%] p-4 rounded-2xl flex flex-col gap-1 ${
                    isUser 
                    ? 'bg-primary text-white rounded-br-sm' 
                    : 'bg-surface-container-low text-on-surface border border-surface-variant rounded-bl-sm'
                }`;

                const content = document.createElement('div');
                content.className = 'font-body-md text-body-md whitespace-pre-wrap';
                content.innerHTML = text; // In a real app, sanitize this or use a markdown parser safely
                
                bubble.appendChild(content);

                if (!isUser) {
                    const footer = document.createElement('div');
                    footer.className = 'font-label-md text-[11px] text-on-surface-variant/70 mt-2 pt-2 border-t border-surface-variant/50 flex items-center gap-1';
                    footer.innerHTML = `<span class="material-symbols-outlined text-[14px]">verified</span> Last updated from sources: 2024-05-20`;
                    bubble.appendChild(footer);
                }

                wrapper.appendChild(bubble);
                return wrapper;
            };

            const createTypingIndicator = () => {
                const wrapper = document.createElement('div');
                wrapper.id = 'typing-indicator';
                wrapper.className = 'flex w-full justify-start message-enter';
                wrapper.innerHTML = `
                    <div class="bg-surface-container-low p-4 rounded-2xl rounded-bl-sm border border-surface-variant flex gap-1 items-center">
                        <div class="w-2 h-2 rounded-full bg-primary/60 typing-dot"></div>
                        <div class="w-2 h-2 rounded-full bg-primary/60 typing-dot"></div>
                        <div class="w-2 h-2 rounded-full bg-primary/60 typing-dot"></div>
                    </div>
                `;
                return wrapper;
            };

            const scrollToBottom = () => {
                const chatContainerParent = chatContainer.parentElement;
                chatContainerParent.scrollTo({
                    top: chatContainerParent.scrollHeight,
                    behavior: 'smooth'
                });
            };

            const handleSend = () => {
                const text = chatInput.value.trim();
                if (!text || isTyping) return;

                // Hide welcome state on first message
                if (welcomeState) {
                    welcomeState.style.display = 'none';
                }

                // Add user message
                chatContainer.appendChild(createMessageElement(text, true));
                chatInput.value = '';
                chatInput.style.height = 'auto';
                sendBtn.setAttribute('disabled', 'true');
                scrollToBottom();

                // Mock typing state
                isTyping = true;
                const typingIndicator = createTypingIndicator();
                setTimeout(() => {
                    chatContainer.appendChild(typingIndicator);
                    scrollToBottom();
                }, 300);

                // Mock response
                setTimeout(() => {
                    typingIndicator.remove();
                    const mockResponse = `Based on the latest fact sheet, the expense ratio for **HDFC Mid-Cap Opportunities Fund** (Regular Plan) is currently **1.54%**.\n\nYou can view the full prospectus on the <a href="#" class="text-primary hover:underline font-medium">HDFC AMC portal</a>.`;
                    chatContainer.appendChild(createMessageElement(mockResponse, false));
                    isTyping = false;
                    scrollToBottom();
                }, 2300);
            };

            sendBtn.addEventListener('click', handleSend);
            
            chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            });

            // Handle Chip Clicks
            chipBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Extract text without quotes
                    const text = btn.innerText.replace(/^"|"$/g, '').trim();
                    chatInput.value = text;
                    handleSend();
                });
            });
            
            // Initialize button state
            sendBtn.setAttribute('disabled', 'true');
        });
    </script>
